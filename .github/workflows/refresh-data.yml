name: Refresh Activity Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run data crawler
        env:
          GITLAB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GITLAB_PERSONAL_ACCESS_TOKEN }}
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
          GITLAB_USER_ID: ${{ secrets.GITLAB_USER_ID }}
        run: node scripts/crawl-data.cjs

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add src/data/dev-activity-initial.json src/data/cp-data-initial.json
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): refresh activity stats [automated]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
